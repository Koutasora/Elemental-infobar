<html>

				hwinfo: "HWiNFO", hwinfoNote: "CPU and GPU readings come from HWiNFO: enable Shared Memory Support in its Settings. The free version turns it off after ~12 h – just enable it again.", show: "Show", showCpu: "CPU temperature", showGpu: "GPU temperature", showRam: "RAM usage", unit: "Unit",
				progress: "Show", pDay: "Day", pWeek: "Week", pMonth: "Month", pYear: "Year",

				theme: "Motyw", font: "Czcionka", refresh: "Częstotliwość odświeżania", rAuto: "Automatyczna", rSec: "na sekundę", sensorEvery: "Odświeżanie odczytów", sEvery: "co", accent: "Kolor akcentu", accentTheme: "Z motywu", accentCustom: "Własny", accentPick: "Wybierz kolor", led: "Boczne diody", ledAuto: "Automatycznie (domyślnie)", ledAccent: "Kolor akcentu", ledCustom: "Własny kolor", ledSplit: "Dwa kolory (lewa / prawa)", ledPick2: "Kolor prawej diody", ledRainbow: "Tęcza", ledPulse: "Pulsowanie (oddech)", ledTemp: "Wg temperatury CPU / GPU", ledHours: "Wg pory dnia", ledWeekday: "Wg dnia tygodnia", ledAlert: "Domyślne, czerwone miganie przy przegrzaniu", ledPick: "Kolor diod (lewej)", ledNote: "Boczne diody biorą kolor z cienkiej linii (2 px) przy dolnej krawędzi paska.",

		try { langChoice = localStorage.getItem("elementalLang") || "auto"; } catch (e) {}
		SDPIComponents.i18n.language = langChoice === "auto" ? (SDPIComponents.i18n.locales[SDPIComponents.i18n.language] ? SDPIComponents.i18n.language : "en") : langChoice;

</head>
<body>
	<sdpi-item label="__MSG_panelLang__">
		<select id="langSel" style="width:100%;background:#2d2d2d;color:#d8d8d8;border:1px solid #555;border-radius:4px;padding:4px">

			<option value="pl">Polski</option>

	</sdpi-item>

	<sdpi-item label="__MSG_mode__">
		<sdpi-select setting="mode" default="clock">
			<option value="clock">__MSG_modeClock__</option>
			<option value="dual">__MSG_modeDual__</option>
			<option value="stats">__MSG_modeStats__</option>
			<option value="dashboard">__MSG_modeDash__</option>
			<option value="analog">__MSG_modeAnalog__</option>
			<option value="progress">__MSG_modeProgress__</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="__MSG_theme__">
		<sdpi-select setting="theme" default="black">

			<option value="midnight">Midnight</option>
			<option value="aurora">Aurora</option>
			<option value="sunset">Sunset</option>
			<option value="forest">Forest</option>
			<option value="mono">Mono</option>

		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="__MSG_font__">

			<option value="Bahnschrift">Bahnschrift</option>
			<option value="Tahoma">Tahoma</option>

		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="__MSG_refresh__">

			<option value="auto">__MSG_rAuto__</option>
			<option value="1">1 __MSG_rSec__</option>
			<option value="2">2 __MSG_rSec__</option>
			<option value="5">5 __MSG_rSec__</option>
			<option value="10">10 __MSG_rSec__</option>
			<option value="15">15 __MSG_rSec__</option>

		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="__MSG_accent__">

			<option value="theme">__MSG_accentTheme__</option>

		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="__MSG_accentPick__" data-when="accentMode=custom">
		<sdpi-color setting="accent" default="#38bdf8"></sdpi-color>
	</sdpi-item>

	<sdpi-item label="__MSG_led__">
		<sdpi-select setting="ledMode" default="auto">
			<option value="auto">__MSG_ledAuto__</option>
			<option value="accent">__MSG_ledAccent__</option>
			<option value="color">__MSG_ledCustom__</option>
			<option value="split">__MSG_ledSplit__</option>
			<option value="rainbow">__MSG_ledRainbow__</option>
			<option value="pulse">__MSG_ledPulse__</option>
			<option value="temp">__MSG_ledTemp__</option>
			<option value="hours">__MSG_ledHours__</option>
			<option value="weekday">__MSG_ledWeekday__</option>
			<option value="alert">__MSG_ledAlert__</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="__MSG_ledPick__" data-when="ledMode=color,pulse,split">

	</sdpi-item>
	<sdpi-item label="__MSG_ledPick2__" data-when="ledMode=split">

	</sdpi-item>
	<sdpi-item label=" ">
		<div style="font-size:11px;line-height:1.4;opacity:.85"><sdpi-i18n key="ledNote"></sdpi-i18n></div>
	</sdpi-item>

	<sdpi-item label="__MSG_dateLang__">
		<sdpi-select setting="clockLang" default="system">
			<option value="system">__MSG_langSystem__</option>
			<option value="en">English</option>
			<option value="pl">Polski</option>

			<option value="fr">Français</option>
			<option value="es">Español</option>
			<option value="it">Italiano</option>
			<option value="cs">Čeština</option>

			<option value="nl">Nederlands</option>

		</sdpi-select>

			<option value="UTC">UTC</option>
			<option value="Europe/Warsaw">Warsaw</option>
			<option value="Europe/London">London</option>
			<option value="Europe/Berlin">Berlin</option>
			<option value="Europe/Paris">Paris</option>
			<option value="Europe/Madrid">Madrid</option>
			<option value="Europe/Rome">Rome</option>
			<option value="Europe/Kyiv">Kyiv</option>
			<option value="America/New_York">New York</option>
			<option value="America/Chicago">Chicago</option>
			<option value="America/Denver">Denver</option>
			<option value="America/Los_Angeles">Los Angeles</option>
			<option value="America/Sao_Paulo">São Paulo</option>
			<option value="Asia/Dubai">Dubai</option>
			<option value="Asia/Kolkata">Kolkata</option>
			<option value="Asia/Shanghai">Shanghai</option>
			<option value="Asia/Tokyo">Tokyo</option>
			<option value="Asia/Seoul">Seoul</option>
			<option value="Australia/Sydney">Sydney</option>

	<sdpi-item label="__MSG_customTz__" data-modes="clock dual stats dashboard analog progress" data-when="tz=custom">

	<sdpi-item label="__MSG_tz2__" data-modes="dual">

			<option value="UTC">UTC</option>
			<option value="Europe/Warsaw">Warsaw</option>
			<option value="Europe/London">London</option>
			<option value="Europe/Berlin">Berlin</option>
			<option value="Europe/Paris">Paris</option>
			<option value="Europe/Madrid">Madrid</option>
			<option value="Europe/Rome">Rome</option>
			<option value="Europe/Kyiv">Kyiv</option>
			<option value="America/Chicago">Chicago</option>
			<option value="America/Denver">Denver</option>
			<option value="America/Los_Angeles">Los Angeles</option>
			<option value="America/Sao_Paulo">São Paulo</option>
			<option value="Asia/Dubai">Dubai</option>
			<option value="Asia/Kolkata">Kolkata</option>
			<option value="Asia/Shanghai">Shanghai</option>
			<option value="Asia/Tokyo">Tokyo</option>
			<option value="Asia/Seoul">Seoul</option>
			<option value="Australia/Sydney">Sydney</option>
			<option value="Pacific/Auckland">Auckland</option>

	<sdpi-item label="__MSG_customTz2__" data-modes="dual" data-when="tz2=custom">

	</sdpi-item>

	<sdpi-item label="__MSG_hour__" data-modes="clock dual stats dashboard analog">
		<sdpi-select setting="hour12" default="24">
			<option value="24">__MSG_h24__</option>
			<option value="12">__MSG_h12__</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="__MSG_seconds__" data-modes="clock analog">
		<sdpi-checkbox setting="showSeconds" label="__MSG_showSeconds__"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item label="__MSG_weekday__" data-modes="clock analog">
		<sdpi-select setting="weekdayStyle" default="long">
			<option value="long">__MSG_wLong__</option>

		<sdpi-checkbox setting="showCpu" default="true" label="__MSG_showCpu__"></sdpi-checkbox>

	</sdpi-item>
	<sdpi-item label=" " data-modes="stats dashboard">

		<sdpi-select setting="sensorInterval" default="2">
			<option value="2">__MSG_sEvery__ 2 s</option>

	<sdpi-item label=" " data-modes="progress">
		<sdpi-checkbox setting="progMonth" default="true" label="__MSG_pMonth__"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item label=" " data-modes="progress">
		<sdpi-checkbox setting="progYear" default="true" label="__MSG_pYear__"></sdpi-checkbox>

	<script>
		// language picker: remember the choice and reload so every label is rebuilt in the new language
		try {
			var sel = document.getElementById("langSel");
			sel.value = langChoice;
			sel.addEventListener("change", function () {
				try { localStorage.setItem("elementalLang", sel.value); } catch (e) {}
				location.reload();
			});
		} catch (err) { console.error(err); }

		// show only the fields that make sense for the chosen mode (if this fails, all fields stay visible)
		try {
			var items = Array.prototype.slice.call(document.querySelectorAll("sdpi-item[data-modes], sdpi-item[data-when]"));
			var apply = function (s) {
				s = s || {};
				var mode = s.mode || "clock";
				items.forEach(function (el) {
					var ok = true;
					var modes = el.getAttribute("data-modes");
					if (modes && modes.split(" ").indexOf(mode) < 0) ok = false;
					var when = el.getAttribute("data-when");
					if (ok && when) {
						var kv = when.split("=");
						var cur = s[kv[0]];
						if (cur === undefined) cur = kv[0] === "accentMode" ? "theme" : kv[0] === "tz" ? "local" : kv[0] === "tz2" ? "America/New_York" : kv[0] === "ledMode" ? "auto" : undefined;
						ok = kv[1].split(",").indexOf(cur) >= 0;
					}
					el.style.display = ok ? "" : "none";
				});
			};
			var client = SDPIComponents.streamDeckClient;
			// Próbnik koloru bywa pokazywany z domyślną wartością, której nie ma w ustawieniach (a po otwarciu zapisuje czerń):
			// wpisujemy kolor do ustawień od razu, żeby to, co widać w próbniku, było tym, co dostaje plugin
			var ensureDefaults = function (s) {
				var patch = {};
				if ((s.ledMode === "color" || s.ledMode === "pulse" || s.ledMode === "split") && (!s.ledColor || s.ledColor === "#000000")) patch.ledColor = "#ff4d8d";
				if (s.ledMode === "split" && (!s.ledColor2 || s.ledColor2 === "#000000")) patch.ledColor2 = "#34d399";
				if (s.accentMode === "custom" && !s.accent) patch.accent = "#38bdf8";
				if (Object.keys(patch).length) { try { client.setSettings(Object.assign({}, s, patch)); } catch (e) { console.error(e); } }
			};
			var refresh = function () { client.getSettings().then(function (e) { apply(e.payload.settings); ensureDefaults(e.payload.settings || {}); }); };
			refresh();
			client.didReceiveSettings.subscribe(function (e) { apply(e.payload.settings); ensureDefaults(e.payload.settings || {}); });
			// zmiana dowolnego pola: pobierz ustawienia ponownie i przelicz widoczność (zaraz i po chwili, gdy zapis już dotarł)
			["change", "input", "click"].forEach(function (ev) { document.addEventListener(ev, function () { setTimeout(refresh, 80); setTimeout(refresh, 400); }, true); });
		} catch (err) { console.error(err); }
	</script>
</body>
</html>
